<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>いちねんせいの かんじ 80</title><style>
:root{font-family:'BIZ UDPGothic','BIZ UDゴシック','Yu Gothic',system-ui,sans-serif;color:#30444a;background:#f5f3ec}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:24px 18px 65px}header{text-align:center;padding:22px 0 14px}h1{font-size:clamp(27px,5vw,42px);margin:5px;color:#344b50}header p{color:#71827b;margin:7px}.top{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.tab,.btn{border:1px solid #c8d4cc;background:#fff;padding:12px 18px;border-radius:13px;font:inherit;font-weight:700;color:#3c5557;cursor:pointer}.tab.active,.btn.primary{background:#547b72;color:#fff;border-color:#547b72}.search{width:min(100%,420px);font:inherit;padding:15px;border:1px solid #c8d4cc;border-radius:13px;background:white;font-size:18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}.panel{background:#fffefa;border:1px solid #e3e4db;border-radius:20px;padding:20px;box-shadow:0 5px 24px #2b3b3010}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.tile{background:#f7f8f3;border:1px solid #dbe5dc;border-radius:13px;min-height:78px;cursor:pointer;color:#344b50;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.tile strong{font-size:35px;font-weight:700}.tile small{font-size:11px;color:#70847d}.tile.selected{background:#e0ede5;border:2px solid #557e72}.tile:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:3px solid #e3af62}.detail{text-align:center;position:sticky;top:14px}.detail h2{margin:0;font-size:27px}.reading{font-size:20px;line-height:1.7;margin:8px 0 5px}.sub{color:#7c8882;font-size:13px}.stage{width:min(100%,270px);aspect-ratio:1;margin:15px auto;background:#fff;border:1px solid #d8e1d9;border-radius:15px;position:relative;display:grid;place-items:center;overflow:hidden}.stage:before,.stage:after{content:'';position:absolute;background:#e9ede9;z-index:0}.stage:before{height:1px;width:100%}.stage:after{width:1px;height:100%}.stage svg{width:100%;height:100%;position:relative;z-index:1}.fallback{font-size:160px;line-height:1;position:relative;z-index:1}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.controls .btn{padding:10px 12px;font-size:14px}.cheer{display:none;margin:14px auto 2px;padding:13px 10px;border-radius:15px;background:#edf5e9;border:1px solid #d5e6d1;color:#3d7564;font-size:clamp(22px,5vw,29px);font-weight:800;letter-spacing:.04em;animation:cheerPop .45s ease-out}.cheer.show{display:block}@keyframes cheerPop{from{opacity:0;transform:scale(.86) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}.status{font-size:13px;color:#647a73;min-height:42px;margin-top:12px;line-height:1.6}.legend{font-size:13px;color:#6b7f76;margin-top:16px}.footer{margin-top:20px;text-align:center;font-size:12px;color:#7b847c}.hide{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.detail{position:static;grid-row:1}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.tile{min-height:66px}.tile strong{font-size:29px}.shell{padding:12px}.panel{padding:14px}}
</style></head><body><main class="shell"><header><div style="color:#7d9a83;letter-spacing:.3em">✦ まなびのじかん ✦</div><h1>いちねんせいの かんじ</h1><p>小学1年生でならう 80字 ／ かきじゅんを みてみよう</p></header><div class="top"><button class="tab active" id="modeKanji">漢字からさがす</button><button class="tab" id="modeReading">よみかたからさがす</button><input id="search" class="search" placeholder="かんじ・よみかたで けんさく" aria-label="検索"></div><div class="layout"><section class="panel"><div id="grid" class="grid"></div><p class="legend" id="count"></p></section><section class="panel detail"><h2 id="selected">一</h2><div class="reading" id="reading"></div><div class="sub" id="strokeCount"></div><div class="stage" id="stage"><span class="fallback">一</span></div><div class="controls"><button class="btn primary" id="play">▶ さいせい</button><button class="btn" id="pause">⏸ とめる</button><button class="btn" id="reset">↺ さいしょから</button></div><div class="cheer" id="cheer" role="status" aria-live="polite">✦ ゆうちゃんすごい！ ✦</div><div class="status" id="status" aria-live="polite"></div><label class="legend">はやさ <select id="speed" style="font:inherit;padding:7px;border-radius:8px"><option value="1.5">ゆっくり</option><option value="1" selected>ふつう</option><option value="0.6">はやい</option></select></label></section></div><p class="footer">書き順データ：KanjiVG（CC BY-SA 3.0）をオンライン取得。初回表示にはインターネット接続が必要です。<br>読みは学習用の代表例です。漢字のすべての読みを掲載したものではありません。</p></main><script>
const data=`一|いち,ひと;右|みぎ,う;雨|あめ,う;円|えん,まる;王|おう;音|おと,おん;下|した,か,げ;火|ひ,か;花|はな,か;貝|かい;学|まなぶ,がく;気|き,け;九|きゅう,く,ここの;休|やすむ,きゅう;玉|たま,ぎょく;金|かね,きん;空|そら,くう,あく;月|つき,げつ,がつ;犬|いぬ,けん;見|みる,けん;五|ご,いつ;口|くち,こう;校|こう;左|ひだり,さ;三|さん,みっ;山|やま,さん;子|こ,し;四|よん,し,よっ;糸|いと,し;字|じ;耳|みみ,じ;七|なな,しち;車|くるま,しゃ;手|て,しゅ;十|じゅう,とお;出|でる,だす,しゅつ;女|おんな,じょ;小|ちいさい,しょう;上|うえ,あがる,じょう;森|もり,しん;人|ひと,じん,にん;水|みず,すい;正|ただしい,せい;生|いきる,うまれる,せい;青|あお,せい;夕|ゆう;石|いし,せき;赤|あか,せき;千|せん,ち;川|かわ,せん;先|さき,せん;早|はやい,そう;草|くさ,そう;足|あし,そく;村|むら,そん;大|おおきい,だい;男|おとこ,だん;竹|たけ,ちく;中|なか,ちゅう;虫|むし,ちゅう;町|まち,ちょう;天|てん,あま;田|た,でん;土|つち,ど;二|に,ふた;日|ひ,にち,か;入|はいる,にゅう;年|とし,ねん;白|しろ,はく;八|はち,やっ;百|ひゃく;文|ぶん,もん;木|き,もく;本|ほん,もと;名|な,めい;目|め,もく;立|たつ,りつ;力|ちから,りょく;林|はやし,りん;六|ろく,むっ`.split(';').map(s=>{let [k,r]=s.split('|');return {k,r:r.split(',')}});
const $=id=>document.getElementById(id);let mode='kanji',selected=data[0],paths=[],timer=null,position=0,paused=false,loadToken=0;const normalize=s=>s.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
function render(){let q=normalize($('search').value.trim());let filtered=data.filter(x=>!q||normalize(x.k).includes(q)||x.r.some(r=>normalize(r).includes(q)));if(mode==='reading')filtered.sort((a,b)=>a.r[0].localeCompare(b.r[0],'ja'));else filtered.sort((a,b)=>data.indexOf(a)-data.indexOf(b));$('grid').innerHTML='';filtered.forEach(x=>{let b=document.createElement('button');b.className='tile'+(x===selected?' selected':'');b.innerHTML=mode==='kanji'?`<strong>${x.k}</strong><small>${x.r[0]}</small>`:`<strong style="font-size:22px">${x.r[0]}</strong><small>${x.k}</small>`;b.onclick=()=>select(x);$('grid').appendChild(b)});$('count').textContent=`${filtered.length}字 を ひょうじしています`}
function stop(){if(timer){clearTimeout(timer);timer=null}}function hideCheer(){$('cheer').classList.remove('show')}function showCheer(){$('cheer').classList.remove('show');void $('cheer').offsetWidth;$('cheer').classList.add('show')}
function select(x){stop();hideCheer();selected=x;position=0;paused=false;$('selected').textContent=x.k;$('reading').textContent=x.r.join(' ・ ');$('strokeCount').textContent='';$('stage').replaceChildren();$('status').textContent='かきじゅんデータを よみこんでいます…';render();loadSvg(x)}
async function loadSvg(x){const token=++loadToken;let code=x.k.codePointAt(0).toString(16).padStart(5,'0');let url=`https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${code}.svg`;try{let response=await fetch(url);if(!response.ok)throw Error('HTTP '+response.status);let raw=await response.text();if(token!==loadToken)return;let doc=new DOMParser().parseFromString(raw,'image/svg+xml');let svg=doc.documentElement;let source=Array.from(svg.querySelectorAll('path')).filter(p=>p.closest('[id*="StrokePaths"]'));if(!source.length)source=Array.from(svg.querySelectorAll('path'));if(!source.length)throw Error('paths missing');let ns='http://www.w3.org/2000/svg',out=document.createElementNS(ns,'svg');out.setAttribute('viewBox','0 0 109 109');out.setAttribute('aria-label',x.k+'の書き順');paths=[];source.forEach(p=>{let np=document.createElementNS(ns,'path');np.setAttribute('d',p.getAttribute('d'));np.setAttribute('fill','none');np.setAttribute('stroke','#466c63');np.setAttribute('stroke-width','3.7');np.setAttribute('stroke-linecap','round');np.setAttribute('stroke-linejoin','round');out.appendChild(np);paths.push(np)});$('stage').replaceChildren(out);paths.forEach(p=>{let len=p.getTotalLength();p.dataset.len=len;p.style.strokeDasharray=len;p.style.strokeDashoffset=len});$('strokeCount').textContent=paths.length+'かく';$('status').textContent='▶ さいせい を おすと、1かくずつ かきます。';}catch(e){if(token!==loadToken)return;paths=[];$('status').textContent='アニメーションを よみこめませんでした。インターネット接続を かくにんしてください。';}}
function step(){if(position>=paths.length){stop();$('status').textContent='できました！ ↺ で もういちど。';showCheer();return}let p=paths[position];let duration=650*Number($('speed').value);p.style.transition=`stroke-dashoffset ${duration}ms ease-in-out`;requestAnimationFrame(()=>p.style.strokeDashoffset='0');position++;$('status').textContent=`${position} / ${paths.length} かくめ`;timer=setTimeout(step,duration+240)}
$('play').onclick=()=>{if(!paths.length){select(selected);return}if(timer)return;if(position>=paths.length){hideCheer();position=0;paths.forEach(p=>{p.style.transition='none';p.style.strokeDashoffset=p.dataset.len})}step()};$('pause').onclick=()=>{stop();$('status').textContent='とまっています。▶ で つづきから。'};$('reset').onclick=()=>{stop();hideCheer();position=0;paths.forEach(p=>{p.style.transition='none';p.style.strokeDashoffset=p.dataset.len});$('status').textContent='さいしょに もどりました。'};$('modeKanji').onclick=()=>{mode='kanji';$('modeKanji').classList.add('active');$('modeReading').classList.remove('active');render()};$('modeReading').onclick=()=>{mode='reading';$('modeReading').classList.add('active');$('modeKanji').classList.remove('active');render()};$('search').oninput=render;select(data[0]);
</script></body></html>
